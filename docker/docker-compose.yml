services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: culinarygraph
      POSTGRES_USER: culinarygraph
      POSTGRES_PASSWORD: culinarygraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culinarygraph"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-kc:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - pgkcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-kc:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: ["start", "--import-realm"]
    volumes:
      - ./keycloak/culinarygraph-realm.json:/opt/keycloak/data/import/culinarygraph-realm.json
    ports:
      - "8180:8080"
    depends_on:
      postgres-kc:
        condition: service_healthy
    # No container healthcheck: official image often has no wget/curl; bad healthcheck = compose stuck "waiting"
    # Keycloak is ready when logs show "Listening on" (~1–3 min with realm import)

  backend:
    build:
      context: ../culinarygraph-backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: culinarygraph
      DB_PASSWORD: culinarygraph
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ../culinarygraph-frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: http://localhost:8180
        VITE_API_BASE: /api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  pgkcdata:
