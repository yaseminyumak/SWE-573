spring.application.name=culinarygraph-backend
server.port=8080

# Datasource (override with env or use defaults for docker-compose-dev)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:culinarygraph}
spring.datasource.username=${DB_USERNAME:culinarygraph}
spring.datasource.password=${DB_PASSWORD:culinarygraph}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
